name: model-catalog-maintenance
on:
  schedule:
    - cron: '23 1 * * *'
  push:
    branches: [main, codex/todo-0130]
    paths: ['scripts/model_catalog/**', 'shared/src/catalog.rs', 'shared/src/models.rs', 'windows/src/engine.rs', 'windows/src/bin/shanjie-model-check.rs', 'platform/**', 'scripts/prepare-*.ps1', 'UPSTREAM.json', '.github/workflows/model-catalog-maintenance.yml']
  workflow_dispatch:
    inputs:
      mode:
        description: 'verify: reports only; publish: verify then update data branch'
        type: choice
        default: verify
        options: [verify, publish]
permissions:
  contents: read
env:
  PYTHONUTF8: '1'
  PYTHONIOENCODING: utf-8
concurrency:
  group: model-catalog-maintenance
  cancel-in-progress: false
jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 75
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node.js 24)
        with:
          submodules: true
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0 (Node.js 24)
        with:
          python-version: '3.12'
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0 (Node.js 24)
        with:
          path: |
            build/model-catalog/assets
            build/model-catalog/probe-cache
            build/english
          key: catalog-${{ github.sha }}-${{ github.run_id }}
          restore-keys: |
            catalog-${{ github.sha }}-
            catalog-
      - name: Contract and fault tests
        run: python -m unittest discover -s scripts/model_catalog -p "test_*.py" -v
      - name: Discover, verify native x64 and x86, compare public data
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/model_catalog/probe.ps1
      - name: Publishable data and evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 (Node.js 24)
        with:
          name: model-catalog-publication
          path: |
            build/model-catalog/publication
            build/model-catalog/publication-plan.json
          if-no-files-found: error
          retention-days: 30
      - name: Summary
        run: |
          $c=Get-Content build/model-catalog/publication/MODEL-CATALOG-V2.json -Raw|ConvertFrom-Json
          "Verified $($c.models.Count) bundles. Revision: $($c.revision). Accuracy never gates availability. Last successful check: $([DateTime]::UtcNow.ToString('o'))" >> $env:GITHUB_STEP_SUMMARY
  publish:
    needs: verify
    if: (github.event_name == 'workflow_dispatch' && inputs.mode == 'publish') || ((github.event_name == 'schedule' || (github.event_name == 'push' && github.ref == 'refs/heads/main')) && vars.MODEL_CATALOG_AUTOPUBLISH == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node.js 24)
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2 (Node.js 24)
        with:
          name: model-catalog-publication
          path: build/model-catalog
      - name: Revalidate sources and atomically publish data only
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/model_catalog/catalog.py publish
