name: model-catalog-maintenance
on:
  schedule:
    - cron: '23 1 * * *'
  push:
    branches: [main, codex/todo-0130]
    paths: ['scripts/model_catalog/**', 'shared/src/catalog.rs', 'shared/src/models.rs', '.github/workflows/model-catalog-maintenance.yml']
  workflow_dispatch:
    inputs:
      mode:
        description: 'verify: reports only; publish: verify then update data branch'
        type: choice
        default: verify
        options: [verify, publish]
permissions:
  contents: read
env:
  PYTHONUTF8: '1'
  PYTHONIOENCODING: utf-8
concurrency:
  group: model-catalog-maintenance
  cancel-in-progress: false
jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 75
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: true
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            build/model-catalog/assets
            build/model-catalog/probe-cache
            build/english
          key: catalog-${{ github.sha }}-${{ github.run_id }}
          restore-keys: |
            catalog-${{ github.sha }}-
            catalog-
      - name: Contract and fault tests
        run: python -m unittest discover -s scripts/model_catalog -p "test_*.py" -v
      - name: Discover, verify native x64 and x86, compare public data
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/model_catalog/probe.ps1
      - name: Publishable data and evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: model-catalog-publication
          path: |
            build/model-catalog/publication
            build/model-catalog/publication-plan.json
          if-no-files-found: error
          retention-days: 30
      - name: Summary
        run: |
          $c=Get-Content build/model-catalog/publication/MODEL-CATALOG-V2.json -Raw|ConvertFrom-Json
          "Verified $($c.models.Count) bundles. Revision: $($c.revision). Accuracy never gates availability." >> $env:GITHUB_STEP_SUMMARY
  publish:
    needs: verify
    if: (github.event_name == 'workflow_dispatch' && inputs.mode == 'publish') || (github.event_name == 'schedule' && vars.MODEL_CATALOG_AUTOPUBLISH == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: model-catalog-publication
          path: build/model-catalog
      - name: Revalidate sources and atomically publish data only
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/model_catalog/catalog.py publish
