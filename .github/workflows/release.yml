name: release

# 先建置及驗證所有指定平台，附件完整後才公開 Release；同來源草稿可安全續作。
on:
  push:
    branches: [main]
    paths: [windows/Cargo.toml]
  workflow_dispatch:
    inputs:
      mode:
        description: 'verify: build only; publish: create or resume a same-source draft'
        type: choice
        default: verify
        options: [verify, publish]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      build_linux: ${{ steps.release.outputs.build_linux }}
      publish: ${{ steps.release.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node.js 24)
        with:
          persist-credentials: false
      - name: Plan the release without publishing
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFY_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.mode != 'publish' }}
        run: |
          flags=()
          if [ "$VERIFY_ONLY" = "true" ]; then flags=(--verify); fi
          python3 scripts/release.py plan "${flags[@]}"

  windows:
    needs: release
    runs-on: windows-latest
    outputs:
      artifact_name: windows-package-${{ github.run_attempt }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node.js 24)
        with:
          submodules: true
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0 (Node.js 24)
        with:
          dotnet-version: 10.0.x
      - name: Cache upstream models
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0 (Node.js 24)
        with:
          path: build/model
          key: models-${{ hashFiles('MODEL-SOURCES.json') }}
      - name: Build and verify the package
        run: pwsh -File scripts/package.ps1
      - name: Unit tests
        run: cargo test --manifest-path windows/Cargo.toml --lib
      - name: Mixed-input regression against the built data
        run: cargo test --manifest-path windows/Cargo.toml --lib -- --ignored mixed_regression --test-threads=1
      - name: Verify release transaction rules
        run: python scripts/test_release.py
      - name: Prepare verified release assets
        run: |
          foreach ($name in @('Shanjie-Windows-Setup.exe')) {
            $hash = (Get-FileHash "dist/$name" -Algorithm SHA256).Hash.ToLowerInvariant()
            Set-Content "dist/$name.sha256" "$hash  $name" -Encoding utf8NoBOM
          }
          python scripts/release.py manifest --platform windows --folder dist
          if ($LASTEXITCODE) { throw 'Release artifact manifest failed.' }
      - name: Build evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 (Node.js 24)
        with:
          name: windows-package-${{ github.run_attempt }}
          path: |
            dist/Shanjie-Windows-Setup.exe
            dist/Shanjie-Windows-Setup.exe.sha256
            dist/release-source.json
          if-no-files-found: error
          retention-days: 7

  linux:
    needs: release
    if: needs.release.outputs.build_linux == 'true'
    runs-on: ubuntu-latest
    # Linux 版的目標是 Fedora 44 GNOME；在同版容器建置，GTK 4／libadwaita 與 glibc 和使用者一致。
    container: fedora:44
    outputs:
      artifact_name: linux-package-${{ github.run_attempt }}
    steps:
      - name: Install build tools
        run: |
          dnf install -y git gh rust cargo gcc pkgconf-pkg-config gtk4-devel libadwaita-devel \
            https://github.com/PowerShell/PowerShell/releases/download/v7.5.4/powershell-7.5.4-1.rh.x86_64.rpm
          git config --global --add safe.directory '*'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node.js 24)
        with:
          submodules: true
          persist-credentials: false
      - name: Cache upstream models
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0 (Node.js 24)
        with:
          path: build/model
          key: models-${{ hashFiles('MODEL-SOURCES.json') }}
      - name: Build the package
        run: linux/scripts/package.sh
      - name: Prepare verified release assets
        run: |
          python3 scripts/release.py manifest --platform linux --folder build/linux/dist
      - name: Upload verified artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 (Node.js 24)
        with:
          name: linux-package-${{ github.run_attempt }}
          path: |
            build/linux/dist/shanjie-linux-*.tar.gz
            build/linux/dist/shanjie-linux-*.tar.gz.sha256
            build/linux/dist/release-source.json
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [release, windows, linux]
    if: >-
      ${{ always() && needs.release.outputs.publish == 'true' &&
          needs.windows.result == 'success' &&
          (needs.linux.result == 'success' || needs.linux.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node.js 24)
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: ${{ needs.windows.outputs.artifact_name }}
          path: build/release-assets/windows
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        if: needs.release.outputs.build_linux == 'true'
        with:
          name: ${{ needs.linux.outputs.artifact_name }}
          path: build/release-assets/linux
      - name: Resume and publish only a complete same-source draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release.py publish --folder build/release-assets
