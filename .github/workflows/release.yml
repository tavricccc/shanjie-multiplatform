name: release

# 版本號（windows/Cargo.toml）變更並推送後，若還沒有對應 tag 就建立 GitHub Release，
# 再建置 Windows zip 與 Linux tar.gz 附上。手動執行時重建並覆蓋目前版本的安裝包。
on:
  push:
    branches: [main]
    paths: [windows/Cargo.toml]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Create release when the version has no tag yet
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' windows/Cargo.toml | head -n 1)
          tag="v${version}"
          if [ -z "$version" ]; then echo "找不到版本號"; exit 1; fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "$tag 已有 release，只更新安裝包"
            exit 0
          fi
          notes="docs/releases/RELEASE-NOTES-${version}.md"
          if [ ! -f "$notes" ]; then echo "缺少 $notes"; exit 1; fi
          gh release create "$tag" --target "$GITHUB_SHA" \
            --title "善解 Windows ${version}" --notes-file "$notes"

  windows:
    needs: release
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Cache upstream models
        uses: actions/cache@v4
        with:
          path: build/model
          key: models-${{ hashFiles('MODEL-SOURCES.json') }}
      - name: Build and verify the package
        run: pwsh -File scripts/package.ps1
      - name: Unit tests
        run: cargo test --manifest-path windows/Cargo.toml --lib
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $hash = (Get-FileHash dist/Shanjie-Windows.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content dist/Shanjie-Windows.zip.sha256 "$hash  Shanjie-Windows.zip" -Encoding utf8NoBOM
          gh release upload "${{ needs.release.outputs.tag }}" dist/Shanjie-Windows.zip dist/Shanjie-Windows.zip.sha256 --clobber
          if ($LASTEXITCODE) { throw 'Release upload failed.' }

  linux:
    needs: release
    runs-on: ubuntu-latest
    # Linux 版的目標是 Fedora 44 GNOME；在同版容器建置，GTK 4／libadwaita 與 glibc 和使用者一致。
    container: fedora:44
    steps:
      - name: Install build tools
        run: |
          dnf install -y git gh rust cargo gcc pkgconf-pkg-config gtk4-devel libadwaita-devel \
            https://github.com/PowerShell/PowerShell/releases/download/v7.5.4/powershell-7.5.4-1.rh.x86_64.rpm
          git config --global --add safe.directory '*'
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Cache upstream models
        uses: actions/cache@v4
        with:
          path: build/model
          key: models-${{ hashFiles('MODEL-SOURCES.json') }}
      - name: Build the package
        run: linux/scripts/package.sh
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ needs.release.outputs.tag }}" build/linux/dist/shanjie-linux-*.tar.gz \
            build/linux/dist/shanjie-linux-*.tar.gz.sha256 --clobber --repo "$GITHUB_REPOSITORY"
