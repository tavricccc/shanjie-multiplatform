name: release

# 版本號（windows/Cargo.toml）變更並推送後，若還沒有對應 tag 就建立 GitHub Release。
# 安裝包需要模型與 Visual Studio 工具，CI 不建置；本機打包後用 gh release upload 附上 zip。
on:
  push:
    branches: [codex/winui3]
    paths: [windows/Cargo.toml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create release when the version has no tag yet
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' windows/Cargo.toml | head -n 1)
          tag="v${version}"
          if [ -z "$version" ]; then echo "找不到版本號"; exit 1; fi
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "$tag 已有 release，略過"
            exit 0
          fi
          notes="docs/releases/RELEASE-NOTES-${version}.md"
          if [ ! -f "$notes" ]; then echo "缺少 $notes"; exit 1; fi
          gh release create "$tag" --target "$GITHUB_SHA" \
            --title "善解 Windows ${version}" --notes-file "$notes"
