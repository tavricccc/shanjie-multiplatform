name: ci

# PR updates and manual runs use only the fixed, model-free CTest CI baseline.
# Full product builds, upstream core suites, TSF/UI regressions and packaging stay local/release-only.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node.js 24)
        with:
          submodules: true
          persist-credentials: false
          fetch-depth: 1
      - name: Check PowerShell syntax
        run: |
          $files = Get-ChildItem scripts -Recurse -File | Where-Object Extension -In '.ps1','.psm1'
          foreach ($file in $files) {
            $tokens = $null; $parseErrors = $null
            $null = [System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$tokens, [ref]$parseErrors)
            if ($parseErrors) { throw "$($file.Name): $($parseErrors.Message -join '; ')" }
          }
      - name: Configure and run the fixed lightweight CTest baseline
        run: pwsh -File scripts/test.ps1 -Level CI -CiSafe
      - name: Upload machine-readable test reports and failure logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 (Node.js 24)
        with:
          name: windows-ctest-${{ github.run_id }}
          path: |
            build/reports/**
            build/cmake/windows-x64/Testing/Temporary/LastTest.log
          if-no-files-found: warn
          retention-days: 14
