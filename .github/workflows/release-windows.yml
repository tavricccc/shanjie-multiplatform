name: Windows Release

on:
  workflow_call:
    inputs:
      cargo_diagnostics:
        description: Collect detailed Cargo build and fingerprint diagnostics
        type: boolean
        default: false
      run_release:
        description: Execution gate from the release plan
        type: boolean
        required: true
      run_full_tests:
        description: Full until post-build evidence and runner equivalence are proven
        type: boolean
        required: true
      reuse_source_commit:
        description: Optional previous main commit for pure-version evidence evaluation
        type: string
        default: ''
      build_linux:
        description: Include the optional Linux package
        type: boolean
        required: true
      publish:
        description: Publication decision from the release plan
        type: boolean
        required: true
    outputs:
      artifact_name:
        description: Verified Windows installer artifact
        value: ${{ jobs.package.outputs.artifact_name }}
      run_release:
        description: Execution gate from Plan
        value: ${{ jobs.package.outputs.run_release }}
      run_full_tests:
        description: Actual result after per-test equivalence and runner checks
        value: ${{ jobs.package.outputs.run_full_tests }}
      publish:
        description: Publication decision from Plan
        value: ${{ jobs.package.outputs.publish }}
      build_linux:
        description: Whether Linux assets are required
        value: ${{ jobs.package.outputs.build_linux }}

permissions:
  contents: read
  actions: read

jobs:
  build-x64:
    name: x64
    runs-on: windows-2025-vs2026
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    outputs:
      artifact: release-build-x64-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/release-setup
        with:
          role: build
          architecture: x64
      - name: Build x64, WinUI and shared data
        env:
          CARGO_LOG: ${{ inputs.cargo_diagnostics && 'cargo::compiler::fingerprint=trace' || '' }}
        run: pwsh -NoProfile -File scripts/release-pipeline.ps1 -Phase Build -Architecture x64 ${{ inputs.cargo_diagnostics && '-CargoVerbose' || '' }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release-build-x64-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/parallel/build-x64.tar
          compression-level: 0
          if-no-files-found: error
          retention-days: 3

  build-x86:
    name: x86
    runs-on: windows-2025-vs2026
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    outputs:
      artifact: release-build-x86-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/release-setup
        with:
          role: build
          architecture: x86
      - name: Build x86 product and recovery probe
        env:
          CARGO_LOG: ${{ inputs.cargo_diagnostics && 'cargo::compiler::fingerprint=trace' || '' }}
        run: pwsh -NoProfile -File scripts/release-pipeline.ps1 -Phase Build -Architecture x86 ${{ inputs.cargo_diagnostics && '-CargoVerbose' || '' }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release-build-x86-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/parallel/build-x86.tar
          compression-level: 0
          if-no-files-found: error
          retention-days: 3

  prepare-core:
    name: Core
    runs-on: windows-2025-vs2026
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    outputs:
      artifact: release-core-build-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/release-setup
        with:
          role: core
      - name: Compile core tests
        run: pwsh -NoProfile -File scripts/release-pipeline.ps1 -Phase PrepareCore
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release-core-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/parallel/core-bundle.tar
          compression-level: 0
          if-no-files-found: error
          retention-days: 3

  seal:
    name: CTest
    needs: [build-x64, build-x86, prepare-core]
    runs-on: windows-2025-vs2026
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    outputs:
      snapshot_id: ${{ steps.seal.outputs.snapshot_id }}
      snapshot_sha256: ${{ steps.seal.outputs.snapshot_sha256 }}
      matrix: ${{ steps.seal.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/release-setup
        with:
          role: verify
          architecture: x64
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: ${{ needs.build-x64.outputs.artifact }}
          path: build/parallel/transfer
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: ${{ needs.build-x86.outputs.artifact }}
          path: build/parallel/transfer
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: ${{ needs.prepare-core.outputs.artifact }}
          path: build/parallel/transfer
      - name: Extract build artifacts
        run: |
          python scripts/release_artifacts.py unpack build/parallel/transfer/build-x64.tar --root .
          if ($LASTEXITCODE) { throw 'x64 extraction failed.' }
          python scripts/release_artifacts.py unpack build/parallel/transfer/build-x86.tar --root .
          if ($LASTEXITCODE) { throw 'x86 extraction failed.' }
          python scripts/release_artifacts.py unpack build/parallel/transfer/core-bundle.tar --root build/parallel
          if ($LASTEXITCODE) { throw 'Core bundle extraction failed.' }
      - name: Seal the snapshot and run FAST prerequisites
        id: seal
        env:
          GH_TOKEN: ${{ github.token }}
          REUSE_SOURCE_COMMIT: ${{ inputs.reuse_source_commit }}
        run: |
          $reuseArgs = @{}
          if ($env:REUSE_SOURCE_COMMIT) { $reuseArgs.ReuseSourceCommit = $env:REUSE_SOURCE_COMMIT }
          & ./scripts/release-pipeline.ps1 -Phase Seal @reuseArgs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release-snapshot-${{ steps.seal.outputs.snapshot_id }}
          path: build/parallel/snapshot.tar
          compression-level: 0
          if-no-files-found: error
          retention-days: 3

      - name: Upload FAST and x64 Cargo group evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release-ci-${{ steps.seal.outputs.snapshot_id }}-bootstrap
          path: build/parallel/verify-bootstrap.tar
          if-no-files-found: error
          retention-days: 7
      - name: Retain failed prerequisite logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: failed-release-prerequisites-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/reports
          if-no-files-found: ignore
          retention-days: 7

  CTest:
    name: ${{ matrix.name }}
    needs: seal
    outputs:
      snapshot_id: ${{ needs.seal.outputs.snapshot_id }}
      snapshot_sha256: ${{ needs.seal.outputs.snapshot_sha256 }}
    runs-on: windows-2025-vs2026
    timeout-minutes: ${{ matrix.phase == 'Verify' && 45 || 30 }}
    strategy:
      fail-fast: true
      max-parallel: 12
      matrix: ${{ fromJSON(needs.seal.outputs.matrix) }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/release-setup
        with:
          role: ${{ matrix.role }}
          architecture: ${{ matrix.architecture || 'x64' }}
      - uses: ./.github/actions/release-snapshot
        with:
          id: ${{ needs.seal.outputs.snapshot_id }}
      - name: Verify assigned tests
        env:
          PARTITION: ${{ matrix.id }}
          ARCHITECTURE: ${{ matrix.architecture || 'x64' }}
          PHASE: ${{ matrix.phase == 'Core' && 'Shard' || 'Verify' }}
          SNAPSHOT_ID: ${{ needs.seal.outputs.snapshot_id }}
          SNAPSHOT_HASH: ${{ needs.seal.outputs.snapshot_sha256 }}
        run: |
          & ./scripts/release-pipeline.ps1 -Phase $env:PHASE -Architecture $env:ARCHITECTURE -Shard $env:PARTITION -SnapshotId $env:SNAPSHOT_ID -SnapshotHash $env:SNAPSHOT_HASH
      - name: Upload partition evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release-ci-${{ needs.seal.outputs.snapshot_id }}-${{ matrix.id }}
          path: build/parallel/${{ matrix.phase == 'Core' && matrix.id || format('verify-{0}', matrix.id) }}.tar
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
      - name: Retain failed partition logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: failed-${{ matrix.id }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/reports
          retention-days: 7

  aggregate:
    name: CTest Merge
    needs: CTest
    outputs:
      snapshot_id: ${{ needs.CTest.outputs.snapshot_id }}
      snapshot_sha256: ${{ needs.CTest.outputs.snapshot_sha256 }}
      run_full_tests: ${{ steps.aggregate.outputs.run_full_tests }}
    runs-on: windows-2025-vs2026
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Initialize pinned upstream (official, then mirror)
        run: pwsh -NoProfile -File scripts/sync-upstream.ps1
      - uses: ./.github/actions/release-snapshot
        with:
          id: ${{ needs.CTest.outputs.snapshot_id }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: release-ci-${{ needs.CTest.outputs.snapshot_id }}-*
          merge-multiple: true
          path: build/parallel/evidence-download
      - name: Extract verification evidence
        run: |
          foreach ($file in Get-ChildItem build/parallel/evidence-download -Filter *.tar) {
            python scripts/release_artifacts.py unpack $file.FullName --root .
            if ($LASTEXITCODE) { throw 'Evidence extraction failed.' }
          }
      - name: Verify core receipts
        id: aggregate
        run: pwsh -NoProfile -File scripts/release-pipeline.ps1 -Phase Aggregate -SnapshotId '${{ needs.CTest.outputs.snapshot_id }}' -SnapshotHash '${{ needs.CTest.outputs.snapshot_sha256 }}'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release-evidence-${{ needs.CTest.outputs.snapshot_id }}
          path: build/parallel/evidence.tar
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
      - name: Retain failed aggregation logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: failed-aggregation-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/reports
          retention-days: 7

  package:
    name: Package
    needs: aggregate
    runs-on: windows-2025-vs2026
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    outputs:
      artifact_name: windows-package-parallel-${{ github.run_attempt }}
      status: ${{ job.status }}
      run_release: ${{ inputs.run_release }}
      run_full_tests: ${{ needs.aggregate.outputs.run_full_tests }}
      publish: ${{ inputs.publish }}
      build_linux: ${{ inputs.build_linux }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Initialize pinned upstream (official, then mirror)
        run: pwsh -NoProfile -File scripts/sync-upstream.ps1
      - uses: ./.github/actions/release-snapshot
        with:
          id: ${{ needs.aggregate.outputs.snapshot_id }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: release-evidence-${{ needs.aggregate.outputs.snapshot_id }}
          path: build/parallel/evidence-download
      - name: Extract accepted evidence
        run: |
          python scripts/release_artifacts.py unpack build/parallel/evidence-download/evidence.tar --root .
          if ($LASTEXITCODE) { throw 'Evidence extraction failed.' }
      - name: Package and verify
        run: pwsh -NoProfile -File scripts/release-pipeline.ps1 -Phase Package -SnapshotId '${{ needs.aggregate.outputs.snapshot_id }}' -SnapshotHash '${{ needs.aggregate.outputs.snapshot_sha256 }}'
      - name: Retain final acceptance reports and logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: windows-ctest-parallel-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/reports
          retention-days: 14
      - name: Build evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: windows-package-parallel-${{ github.run_attempt }}
          path: |
            dist/Shanjie-Windows-Setup.exe
            dist/Shanjie-Windows-Setup.exe.sha256
            dist/release-source.json
          if-no-files-found: error
          retention-days: 7
      - name: Retain full main Release test attestation
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && hashFiles('build/parallel/full-attestation/attestation.json') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release-test-attestation-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/parallel/full-attestation
          if-no-files-found: error
          retention-days: 90
