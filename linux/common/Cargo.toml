[package]
name = "shanjie-linux"
version = "0.12.0"
edition = "2021"
publish = false

[lib]
name = "shanjie_linux"

[dependencies]
shanjie-shell = { path = "../../shared" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }

[workspace]
