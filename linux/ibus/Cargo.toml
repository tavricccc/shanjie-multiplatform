[package]
name = "shanjie-ibus"
version = "0.12.1"
edition = "2021"
publish = false

[[bin]]
name = "ibus-engine-shanjie"
path = "src/main.rs"

[dependencies]
shanjie-core = { package = "core", path = "../../build/core" }
shanjie-shell = { path = "../../shared" }
shanjie-linux = { path = "../common" }
zbus = { version = "5", default-features = false, features = ["async-io"] }
futures-lite = "2"

[workspace]
