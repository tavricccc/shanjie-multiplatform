[package]
name = "shanjie-windows"
version = "0.8.2"
edition = "2021"

[lib]
name = "shanjie_windows"
crate-type = ["staticlib", "rlib", "cdylib"]

[dependencies]
shanjie-core = { package = "core", path = "../build/core" }
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows-numerics = "0.3.1"
windows-core = "0.62.2"
tiny-skia = "0.11.4"
windows = { version = "0.62.2", features = [
  "Win32_Foundation", "Win32_Graphics_Direct2D",
  "Win32_Graphics_Direct2D_Common", "Win32_Graphics_DirectWrite", "Win32_Graphics_Dxgi_Common",
  "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_System_Com", "Win32_System_LibraryLoader",
  "Win32_System_Registry", "Win32_System_Threading", "Win32_System_Environment", "Win32_Security",
  "Win32_Storage_FileSystem", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_HiDpi", "Win32_Globalization", "Win32_UI_TextServices", "Win32_UI_Shell",
  "Win32_UI_Accessibility", "Win32_UI_Controls",
  "Win32_System_Variant", "Win32_System_Ole", "Win32_Security_Authorization", "Win32_System_IO",
] }

[workspace]
